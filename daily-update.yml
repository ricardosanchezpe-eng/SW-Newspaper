name: Daily SOLMAX newspaper update
on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_daily.py
