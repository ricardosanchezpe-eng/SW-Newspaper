name: Daily SOLMAX newspaper update
on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate daily edition
        run: python scripts/update_daily.py
      - name: Save daily edition
        run: |
          git config user.name "SOLMAX Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily.json
          git diff --cached --quiet || git commit -m "Daily newspaper update"
          git push
