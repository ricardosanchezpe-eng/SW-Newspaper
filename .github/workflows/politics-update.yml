name: Weekly verified politics update
on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * 1'
permissions:
  contents: write
jobs:
  update-politics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify politics from official sources
        run: python scripts/update_politics.py
      - name: Save verified politics data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/politics.json
          git diff --cached --quiet || git commit -m "Update verified politics data"
          git push
