name: Daily opportunity radar update
on:
  workflow_dispatch:
  schedule:
    - cron: '5 6 * * 1-5'
permissions:
  contents: write
jobs:
  opportunities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve Official Journal procurement notices
        run: python scripts/update_opportunities.py
      - name: Save opportunity radar
        run: |
          git config user.name "SOLMAX Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunities.json
          git diff --cached --quiet || git commit -m "Update opportunity radar"
          git pull --rebase origin main
          git push origin HEAD:main
