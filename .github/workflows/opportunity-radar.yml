name: Daily opportunity radar update
on:
  workflow_dispatch:
  schedule:
    - cron: '5 6 * * 1-5'
permissions:
  contents: write
jobs:
  opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and classify TED procurement notices
        run: python scripts/update_opportunities.py
      - name: Show collection diagnostics
        if: always()
        run: |
          test -f data/opportunities.json && python - <<'PY'
          import json
          d=json.load(open('data/opportunities.json',encoding='utf-8'))
          for x in d.get('diagnostics',[]): print(x)
          print('radar records:',len(d.get('opportunities',[])))
          PY
      - name: Save opportunity radar
        run: |
          git config user.name "SOLMAX Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunities.json
          git diff --cached --quiet || git commit -m "Update opportunity radar"
          git pull --rebase origin main
          git push origin HEAD:main
